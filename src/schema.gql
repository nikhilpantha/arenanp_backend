  """The "you owe staff" figure. Monthly staff only."""
  dueTotal: Float!

  """Human label, e.g. "August 2026"."""
  label: String!
  paidTotal: Float!

  """First day of the period, "yyyy-mm-dd"."""
  periodStart: String!
  rows: [StaffSalaryRow!]!

