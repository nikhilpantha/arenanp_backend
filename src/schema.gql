"""A sport the venue offers, with its courts, slot length and price."""
input VenueServiceInput {
  """Legacy: number of identical courts to create."""
  courtCount: Int! = 1

  """
  Per-court detail; overrides courtCount/slotMinutes/pricePerHour when set.
  """
  courts: [VenueCourtInput!]

  """Legacy: fanned out onto every court that omits its own features."""
  features: [String!]! = [] @deprecated(reason: "Set `features` on each court instead — a venue can have a wooden court and a cement one.")

  """Legacy: per-hour price when courts[] is omitted."""
  pricePerHour: Float

  """Legacy: slot length when courts[] is omitted."""
  slotMinutes: Int! = 60

  """Sport slug, e.g. "futsal" (matches Sport.slug)."""
  sportSlug: String!
}

input VenueStaffActivityInput {
  """Defaults to 30 days ago."""
  from: DateTime
  membershipId: ID!

  """Defaults to now."""
  to: DateTime
  venueId: ID!
}

"""One person with a seat at this venue."""
type VenueStaffMember {
  createdAt: DateTime!
  fullName: String

  """The venue is legally theirs — they can never be removed or demoted."""
  isPrimaryOwner: Boolean!

  """This row is the person looking at the screen."""
  isSelf: Boolean!
  lastLoginAt: DateTime

  """
  The address the venue minted for them. Null for an attached personal account — the owner typed that person's phone number, not their email, and it stays that way.
  """
  loginEmail: String
  membershipId: ID!

  """They haven't replaced the password the owner set for them yet."""
  mustChangePassword: Boolean!

  """
  How they are paid. Null for anyone not on a wage — a one-off helper still gets payments recorded, just with nothing expected.
  """
  payBasis: PayBasis

  """Per month, per day or per session."""
  payRate: Float

  """Effective set: role defaults ∪ per-seat overrides."""
  permissions: [String!]!
  phoneNumber: String!

  """
  The venue minted this login, rather than attaching an existing account.
  """
  provisionedUser: Boolean!
  role: VenueMemberRole!
  status: MembershipStatus!
  userId: ID!
}

