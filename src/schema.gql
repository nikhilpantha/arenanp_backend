"""
How a staff member's pay is reckoned. MONTHLY is the only basis whose owed amount the system can work out unaided; DAILY and PER_SESSION need a count the owner enters when settling up.
"""
enum PayBasis {
  DAILY
  MONTHLY
  PER_SESSION
}

"""
Provider that processed the payment (Nepal-first list + MANUAL for offline reconciliation).
"""
enum PaymentProvider {
  BANK_TRANSFER
  CASH
  ESEWA
  FONEPAY
  IMEPAY
  KHALTI
  MANUAL
  STRIPE
}

"""
Payment state across providers. REFUNDED / PARTIALLY_REFUNDED feed into the refunds module.
"""
enum PaymentStatus {
  FAILED
  PARTIALLY_REFUNDED
  PENDING
  REFUNDED
  SUCCEEDED
}

"""
Aggregate totals for a payment filter set — used to power the KPI strip.
"""
type PaymentsOverview {
  currency: String!
  grossRevenue: Float!
  platformCommission: Float!
  refundedTotal: Float!
  venuesOwed: Float!
  venuesSettled: Float!
}

"""
Platform-held settlement balance owed to the venue (separate from its own books).
"""
type PayoutSummary {
  lastPaidAt: DateTime
  onHold: Float!
  paidOut: Float!
  pendingPayout: Float!
}

"""Revenue + booking volume for one hour of the day (0–23, Nepal time)."""
type PeakHourPoint {
  bookings: Int!
  hour: Int!
  revenue: Float!
}

"""
Business area a permission belongs to: PLATFORM_ADMINISTRATION, VENUE_MANAGEMENT or TOURNAMENT_MANAGEMENT.
"""
enum PermissionDomain {
  PLATFORM_ADMINISTRATION
  TOURNAMENT_MANAGEMENT
  VENUE_MANAGEMENT
}

type PermissionObject {
  description: String
  domain: PermissionDomain!
  id: ID!
  key: String!
  name: String!
}

