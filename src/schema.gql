"""Who a loyalty offer applies to: ALL, INDIVIDUAL or TEAM."""
enum OfferAudience {
  ALL
  INDIVIDUAL
  TEAM
}

"""How an offer reduces a booking subtotal: PERCENT, FLAT or FREE_GAME."""
enum OfferDiscountType {
  FLAT
  FREE_GAME
  PERCENT
}

"""A venue discount / promo code, or a loyalty free-game reward."""
type OfferModel {
  audience: OfferAudience!

  """Promo code (upper-cased); null = always-listed offer."""
  code: String
  createdAt: DateTime!
  description: String
  discountType: OfferDiscountType!

  """Percent (0–100) for PERCENT, or a flat amount for FLAT."""
  discountValue: Float!

  """For EVERY_NTH: free game every N games."""
  everyGames: Int
  id: ID!
  isActive: Boolean!

  """Cap on a PERCENT discount."""
  maxDiscount: Float

  """Minimum booking subtotal to qualify."""
  minSubtotal: Float!
  title: String!
  trigger: OfferTrigger!
  usageCount: Int!
  usageLimit: Int
  validFrom: DateTime!

  """Null = open-ended; runs until switched off."""
  validUntil: DateTime
  venueId: ID!
}

type OfferPerformance {
  freeGamesForgoneValue: Float!
  freeGamesRedeemed: Int!
  offers: [OfferRoi!]!
  totalDriven: Float!
  totalGiven: Float!
}

"""Cost vs. revenue for a single offer over the period."""
type OfferRoi {
  code: String

  """Discount + forgone free-game value given on this offer."""
  givenAmount: Float!
  offerId: ID!
  redemptions: Int!

  """Total billed on bookings that used this offer."""
  revenueDriven: Float!
  title: String!
}

"""
What triggers an offer: PROMO_CODE (code entry) or EVERY_NTH (loyalty reward).
"""
enum OfferTrigger {
  EVERY_NTH
  PROMO_CODE
}

