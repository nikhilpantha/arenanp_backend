}

type PopularCityItem {
  bookings: Int!
  city: String!
}

type PopularSportItem {
  bookings: Int!
  sport: String!
}

"""
A presigned S3 upload. PUT the file to `uploadUrl`, then store `key` in the relevant mutation.
"""
type PresignedUpload {
  """Content-Type header the client MUST send on the PUT."""
  contentType: String!

  """Seconds until uploadUrl expires — PUT promptly."""
  expiresIn: Int!

  """
  The S3 object key. Persist THIS (not uploadUrl) in avatarUrl / imageUrls / documentUrls etc.
  """
  key: String!

  """Advisory max file size in bytes for this category."""
  maxBytes: Int!

  """HTTP method to use against uploadUrl (always "PUT")."""
  method: String!

  """
  Presigned URL to PUT the file to. Send the same Content-Type header used to request it.
  """
  uploadUrl: String!
}

