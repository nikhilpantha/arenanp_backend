type PermissionScopeObject {
  permissionCount: Int!
  scopeId: String!
  scopeType: PermissionScopeType!
}

"""
What a permission grant applies to: PLATFORM (whole platform), VENUE (one venue) or TOURNAMENT (one tournament).
"""
enum PermissionScopeType {
  PLATFORM
  TOURNAMENT
  VENUE
}

"""
Platform-wide configuration. Singleton — one row per environment. Edited from /admin/settings.
"""
